# Static site: there is no build step, and that is the point. What is in the
# repository is what runs in the browser, so a judge can read the source and
# know it matches what they are using.
[build]
  publish = "."
  command = ""

# WebMCP needs a secure top-level context; Netlify serves HTTPS by default.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/demo-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
